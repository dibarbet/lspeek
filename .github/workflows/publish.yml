name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# All three tools (lspeek, lspeek-mcp, lspeek-backend) are native-AOT-aware,
# RID-specific .NET tools (win-x64 + linux-x64). Each ships as:
#   * a small routing MANIFEST package (project metadata only, OS-agnostic), plus
#   * one self-contained per-RID PAYLOAD package per OS.
# The frontends (lspeek, lspeek-mcp) are self-contained and bundle the backend's
# native-AOT executable for the matching RID, so their RID payloads must be packed
# on the matching OS (native AOT can't cross-compile). The backend additionally
# ships an `any` framework-dependent fallback for the canvas's `dotnet dnx` path.
jobs:
  # OS-agnostic packages: the routing manifests for all three tools and the backend's
  # framework-dependent `any` fallback. None of these compile native AOT.
  pack-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Pack lspeek (TUI) manifest
        run: dotnet pack src/Client.Tui/Client.Tui.csproj --configuration Release --output ${{ github.workspace }}/artifacts/manifest --nologo

      - name: Pack lspeek-mcp manifest
        run: dotnet pack src/Client.Mcp/Client.Mcp.csproj --configuration Release --output ${{ github.workspace }}/artifacts/manifest --nologo

      - name: Pack lspeek-backend manifest
        run: dotnet pack src/Client.Backend/Client.Backend.csproj --configuration Release --output ${{ github.workspace }}/artifacts/manifest --nologo

      - name: Pack lspeek-backend.any (framework-dependent fallback)
        run: dotnet pack src/Client.Backend/Client.Backend.csproj --configuration Release -r any -p:PublishAot=false --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Upload manifest packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-manifest
          path: artifacts/manifest/*.nupkg
          if-no-files-found: error

      - name: Upload backend any (FDD) package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-rid-any
          path: artifacts/rids/lspeek-backend.any.*.nupkg
          if-no-files-found: error

  # win-x64 self-contained payloads for all three tools. The frontends bundle the
  # backend's native-AOT win-x64 exe, so this must run on Windows (AOT can't
  # cross-compile). windows-latest ships the MSVC/Windows SDK toolchain ILC needs.
  pack-win:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Pack lspeek (TUI) win-x64
        run: dotnet pack src/Client.Tui/Client.Tui.csproj --configuration Release -r win-x64 --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Pack lspeek-mcp win-x64
        run: dotnet pack src/Client.Mcp/Client.Mcp.csproj --configuration Release -r win-x64 --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Pack lspeek-backend win-x64 (native AOT)
        run: dotnet pack src/Client.Backend/Client.Backend.csproj --configuration Release -r win-x64 --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Upload win-x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-rid-win
          path: artifacts/rids/*.win-x64.*.nupkg
          if-no-files-found: error

  # linux-x64 self-contained payloads for all three tools. The frontends bundle the
  # backend's native-AOT linux-x64 exe; clang + zlib are required for the ILC native
  # link step.
  pack-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack lspeek (TUI) linux-x64
        run: dotnet pack src/Client.Tui/Client.Tui.csproj --configuration Release -r linux-x64 --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Pack lspeek-mcp linux-x64
        run: dotnet pack src/Client.Mcp/Client.Mcp.csproj --configuration Release -r linux-x64 --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Pack lspeek-backend linux-x64 (native AOT)
        run: dotnet pack src/Client.Backend/Client.Backend.csproj --configuration Release -r linux-x64 --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Upload linux-x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-rid-linux
          path: artifacts/rids/*.linux-x64.*.nupkg
          if-no-files-found: error

  publish:
    needs: [pack-manifests, pack-win, pack-linux]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push every RID-specific PAYLOAD (win-x64, linux-x64, and the backend `any`
      # fallback) FIRST, so each routing manifest only goes live once every package
      # it points at already exists. All packages share one deterministic version
      # (Nerdbank.GitVersioning from the same checked-out commit), and
      # `dotnet nuget push` takes a single glob, so push one artifact folder per call.
      - name: Push RID payloads
        run: |
          for dir in pkg-rid-win pkg-rid-linux pkg-rid-any; do
            dotnet nuget push "artifacts/$dir/*.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate --force-english-output
          done

      # Push the routing manifests (lspeek, lspeek-mcp, lspeek-backend) LAST.
      - name: Push manifests
        run: |
          dotnet nuget push "artifacts/pkg-manifest/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate --force-english-output
