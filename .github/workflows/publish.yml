name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Packaging model
# ---------------
# Every tool ships as a small routing MANIFEST package (project metadata only, OS-agnostic)
# plus one self-contained per-RID PAYLOAD package.
#
#   * Frontends (lspeek, lspeek-mcp) are self-contained *JIT* tools that bundle a self-contained
#     *JIT* copy of the backend for the matching RID. JIT cross-compiles to any RID from any OS, so
#     a single `dotnet pack` (no -r) on ONE runner emits the manifest + all 8 RID payloads, with no
#     per-OS native toolchain. Hence the frontends cover the full RID set (win/linux/osx, x64/arm64,
#     glibc/musl) from one ubuntu job.
#   * The standalone backend (lspeek-backend) is additionally published native-AOT for win-x64 and
#     linux-x64 (for the canvas's `dotnet dnx lspeek-backend` path), plus an `any` framework-dependent
#     fallback. Native AOT can't cross-compile, so each native RID is packed on its matching OS.
jobs:
  # OS-agnostic / cross-compilable packages, all buildable on one ubuntu runner with no native
  # toolchain: the frontends (manifest + all 8 self-contained JIT payloads each, bundling the JIT
  # backend), the backend routing manifest, and the backend `any` framework-dependent fallback.
  pack-portable:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      # One pack per frontend -> routing manifest + 8 self-contained JIT payloads (each with the
      # JIT backend bundled under tools/any/<rid>/backend/). The SDK fans the RIDs out in parallel.
      - name: Pack lspeek (TUI) — manifest + all RID payloads
        run: dotnet pack src/Client.Tui/Client.Tui.csproj --configuration Release --output ${{ github.workspace }}/artifacts/portable --nologo

      - name: Pack lspeek-mcp — manifest + all RID payloads
        run: dotnet pack src/Client.Mcp/Client.Mcp.csproj --configuration Release --output ${{ github.workspace }}/artifacts/portable --nologo

      - name: Pack lspeek-backend manifest
        run: dotnet pack src/Client.Backend/Client.Backend.csproj --configuration Release --output ${{ github.workspace }}/artifacts/portable --nologo

      - name: Pack lspeek-backend.any (framework-dependent fallback)
        run: dotnet pack src/Client.Backend/Client.Backend.csproj --configuration Release -r any -p:PublishAot=false --output ${{ github.workspace }}/artifacts/portable --nologo

      - name: Upload portable packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-portable
          path: artifacts/portable/*.nupkg
          if-no-files-found: error

  # Backend native-AOT win-x64 payload. Must run on Windows (AOT can't cross-compile);
  # windows-latest ships the MSVC/Windows SDK toolchain ILC needs.
  pack-backend-win:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Pack lspeek-backend win-x64 (native AOT)
        run: dotnet pack src/Client.Backend/Client.Backend.csproj --configuration Release -r win-x64 --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Upload win-x64 backend package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-backend-win
          path: artifacts/rids/lspeek-backend.win-x64.*.nupkg
          if-no-files-found: error

  # Backend native-AOT linux-x64 payload. clang + zlib are required for the ILC native link step.
  pack-backend-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack lspeek-backend linux-x64 (native AOT)
        run: dotnet pack src/Client.Backend/Client.Backend.csproj --configuration Release -r linux-x64 --output ${{ github.workspace }}/artifacts/rids --nologo

      - name: Upload linux-x64 backend package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-backend-linux
          path: artifacts/rids/lspeek-backend.linux-x64.*.nupkg
          if-no-files-found: error

  publish:
    needs: [pack-portable, pack-backend-win, pack-backend-linux]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten packages into one directory
        run: |
          mkdir -p _all
          find artifacts -name '*.nupkg' -exec cp -n {} _all/ \;
          ls -1 _all

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push every RID-specific PAYLOAD (any filename with a RID token) FIRST, then the routing
      # MANIFESTS (filenames with no RID token) LAST, so each manifest only goes live once every
      # package it points at already exists. All packages share one deterministic version
      # (Nerdbank.GitVersioning from the same checked-out commit).
      - name: Push packages (payloads first, manifests last)
        run: |
          set -euo pipefail
          cd _all
          is_payload() {
            case "$1" in
              *.win-x64.*|*.win-arm64.*|*.linux-x64.*|*.linux-arm64.*|*.linux-musl-x64.*|*.linux-musl-arm64.*|*.osx-x64.*|*.osx-arm64.*|*.any.*) return 0 ;;
              *) return 1 ;;
            esac
          }
          push() {
            dotnet nuget push "$1" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate --force-english-output
          }
          for f in *.nupkg; do if is_payload "$f"; then echo "payload: $f"; push "$f"; fi; done
          for f in *.nupkg; do if ! is_payload "$f"; then echo "manifest: $f"; push "$f"; fi; done
